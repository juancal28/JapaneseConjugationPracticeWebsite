<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>Random Verb Conjugation Practice</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <script>
      // Same theme bootstrap as gatsby-plugin-dark-mode on the original site.
      void (function () {
        window.__onThemeChange = function () {};
        var preferredTheme;
        try { preferredTheme = localStorage.getItem("theme"); } catch (err) {}
        function setTheme(newTheme) {
          if (preferredTheme && document.body.classList.contains(preferredTheme)) {
            document.body.classList.replace(preferredTheme, newTheme);
          } else {
            document.body.classList.add(newTheme);
          }
          window.__theme = newTheme;
          preferredTheme = newTheme;
          window.__onThemeChange(newTheme);
        }
        window.__setPreferredTheme = function (newTheme) {
          setTheme(newTheme);
          try { localStorage.setItem("theme", newTheme); } catch (err) {}
        };
        var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");
        darkQuery.addListener(function (e) { window.__setPreferredTheme(e.matches ? "dark" : "light"); });
        setTheme(preferredTheme || (darkQuery.matches ? "dark" : "light"));
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
